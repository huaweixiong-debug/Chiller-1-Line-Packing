[database]
host = "192.168.3.100"
port = 3306
user = "root"
name = "test"
password_env = "PACKAGING_DB_PASSWORD"

[scanner]
mode = "tcp"
host = "192.168.3.69"
port = 9004
timeout = 5.0
# mode = "serial" 时改用下面这些串口参数（扫码枪接在现场电脑 COM 口上）
com_port = "COM1"
baudrate = 9600
bytesize = 8
parity = "N"
stopbits = 1

[paths]
bartend_exe = "C:/Program Files/Seagull/BarTender Suite/bartend.exe"
label_template = "D:/Label.btw"
final_box_file = "D:/最终装箱码.txt"
box_sequence_file = "D:/箱码.txt"
laser_archive_dir = "D:/装箱激光码"
journal_file = "%ProgramData%/PackagingStation/box_journal.json"

[app]
station_name = "包装工位"
# 达到该长度的扫码按“装箱”处理，否则只查询
pack_min_length = 22

# information 表的列名映射（现场表结构变化时只改这里）
[columns]
code = "上线码"
time = "测试时间"
dry_result = "干检结果"
helium_result = "氦检结果"
tightening_result = "拧紧结果"
vision_result = ""      # 视觉检测结果列名；现场表还没有这一列时留空（灯显示“未接入”）
box = "装箱码"
model = "产品型号"

# 装箱审核开关；当前只激活干检核验，氦检/拧紧/视觉检测仅显示不阻断
[checks]
dry_test = true
helium = false
tightening = false
vision = false
duplicate = true

# 可选：奇瑞 KD 标签二维码（默认关闭；开启后在写完现有打印文件后额外写一份载荷文本，不改名现有文件）
[chery_label]
enabled = false
part_no = "30100351AA"
batch = ""
layers = ""
# qty_override = ""   # 留空则用零件表默认包装数量
qr_payload_file = "D:/奇瑞二维码.txt"
counters_file = "%ProgramData%/PackagingStation/chery_counters.json"
